name: Product idea
description: Something you want the INITE visibility MCP server (or the inite.ai audit behind it) to make possible. Plain words are fine.
title: "idea: "
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        No engineering knowledge needed. If an AI agent helped you (`/contribute` or `/spec-idea`
        in Claude Code, or "read AGENTS.md"), paste its spec at the bottom. Never paste a token.
  - type: textarea
    id: what
    attributes:
      label: What do you want to be possible?
      placeholder: "e.g. check_ai_access also says whether the sitemap listed in robots.txt is reachable"
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who is it for / why
      placeholder: Who needs this, and what do they do today instead?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How would you know it works?
      placeholder: A site to try it on, and what you would expect the tool to say.
    validations:
      required: true
  - type: checkboxes
    id: parts
    attributes:
      label: Which part does it touch?
      description: Best guess; "not sure" is fine.
      options:
        - label: A local check (check_ai_access, check_identity_files, check_page_signals, or a new one)
        - label: Sign-in, or how the package connects to inite.ai
        - label: The inite.ai audit, score, portal or Atlas tools (server-side, not in this repo)
        - label: Not sure
  - type: textarea
    id: spec
    attributes:
      label: Spec (if an agent wrote one)
      description: Problem, what the tool reports, tool surface change, what is fetched, risks, out of scope, zone.
    validations:
      required: false
